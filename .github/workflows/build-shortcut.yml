name: Build & Sign Jelly Shortcut

on:
  push:
    paths:
      - '**/*.jelly'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $HOME/.zprofile
          eval "$(/opt/homebrew/bin/brew shellenv)"

      - name: Install Jelly CLI
        run: |
          brew tap jellycuts/formulae
          brew install jelly

      - name: Build Shortcuts
        run: |
          mkdir output
          for f in *.jelly; do
            jelly "$f" --export --out "output/${f%.jelly}.shortcut"
          done

      - name: Sign Shortcuts
        run: |
          for s in output/*.shortcut; do
            shortcuts sign \
              --mode anyone \
              --input "$s" \
              --output "${s%.shortcut}-signed.shortcut"
          done

      - name: Upload signed shortcuts
        uses: actions/upload-artifact@v3
        with:
          name: signed-shortcuts
          path: output/*-signed.shortcut
