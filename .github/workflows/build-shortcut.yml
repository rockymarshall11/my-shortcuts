name: Build & Commit Jelly Shortcut

# so we can push back to the repo
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Jelly CLI
        run: |
          brew tap jellycuts/formulae
          brew install jelly

      - name: Build & sign shortcut
        run: |
          mkdir -p output
          for f in *.jelly; do
            jelly "$f" --export --out "output/${f%.jelly}.shortcut"
            shortcuts sign \
              --mode anyone \
              --input "output/${f%.jelly}.shortcut" \
              --output "output/${f%.jelly}-signed.shortcut"
          done

      - name: Commit compiled shortcut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*-signed.shortcut
          git commit -m "Add compiled shortcut [skip ci]" || echo "Nothing to commit"
          git push
