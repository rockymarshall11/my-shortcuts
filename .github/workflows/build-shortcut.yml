name: Build & Sign Jelly Shortcut

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Jelly CLI
        run: |
          brew tap jellycuts/formulae
          brew install jelly

      - name: Build & sign shortcut
        run: |
          mkdir -p output
          for f in *.jelly; do
            jelly "$f" --export --out "output/${f%.jelly}.shortcut"
            shortcuts sign --mode anyone --input "output/${f%.jelly}.shortcut" --output "output/${f%.jelly}-signed.shortcut"
          done

      - name: Upload signed shortcut
        uses: actions/upload-artifact@v3
        with:
          name: signed-shortcuts
          path: output/*.shortcut
